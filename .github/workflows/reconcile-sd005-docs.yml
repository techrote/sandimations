name: Reconcile SD-005 Docs

on:
  push:
    branches:
      - sd-005-presentation-shell

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sd-005-presentation-shell
      - name: Reconcile repository-native status and contracts
        run: python scripts/reconcile-sd005-docs.py
      - name: Commit documentation reconciliation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/RAG.md docs/ARCHITECTURE.md docs/VERIFY.md
          git commit -m "docs: reconcile SD-005 presentation shell"
          git push origin HEAD:sd-005-presentation-shell
