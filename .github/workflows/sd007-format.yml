name: SD-007 one-shot formatter

on:
  push:
    branches:
      - sd-007-phased-sampling

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: sd-007-phased-sampling

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply repository formatting
        run: npx prettier --write .

      - name: Remove one-shot workflow
        run: rm .github/workflows/sd007-format.yml

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: format SD-007 changes"
          git push origin HEAD:sd-007-phased-sampling
