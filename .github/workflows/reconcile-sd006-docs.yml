name: Reconcile SD-006 Docs

on:
  push:
    branches:
      - sd-006-chunk-sleep-wake

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sd-006-chunk-sleep-wake
      - run: python scripts/reconcile-sd006-docs.py
      - name: Commit documentation reconciliation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/RAG.md docs/TRACE_PROTOCOL.md docs/ARCHITECTURE.md docs/VERIFY.md
          git commit -m "docs: reconcile SD-006 chunk sleep wake model"
          git push origin HEAD:sd-006-chunk-sleep-wake
