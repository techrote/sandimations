name: Format SD-005

on:
  push:
    branches:
      - sd-005-presentation-shell

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sd-005-presentation-shell
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply focused-input audit fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/ui/app.ts')
          text = path.read_text()
          old_map = "  const overlayCheckboxes = new Map<OverlayKind, HTMLInputElement>();\n"
          old_set = "    overlayCheckboxes.set(item.kind, checkbox);\n"
          old_input = "      setInputValue(binding.input, parameter.definition, displayedParameterValue(parameter));"
          new_input = """      if (document.activeElement !== binding.input) {
                setInputValue(binding.input, parameter.definition, displayedParameterValue(parameter));
              }"""
          for needle in (old_map, old_set, old_input):
              if needle not in text:
                  raise SystemExit(f'Expected SD-005 audit target not found: {needle!r}')
          text = text.replace(old_map, '', 1).replace(old_set, '', 1).replace(old_input, new_input, 1)
          path.write_text(text)
          PY
      - name: Apply repository formatting
        run: >-
          npx prettier --write
          src/presentation/app-view-model.ts
          src/presentation/evidence-adapter.ts
          src/ui/app.ts
      - name: Commit audit fixes if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/presentation/app-view-model.ts src/presentation/evidence-adapter.ts src/ui/app.ts
          git commit -m "fix: preserve active parameter edits during playback"
          git push origin HEAD:sd-005-presentation-shell
