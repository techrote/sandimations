name: Format SD-005

on:
  push:
    branches:
      - sd-005-presentation-shell

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sd-005-presentation-shell
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply repository formatting
        run: >-
          npx prettier --write
          src/presentation/app-view-model.ts
          src/presentation/evidence-adapter.ts
          src/ui/app.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/presentation/app-view-model.ts src/presentation/evidence-adapter.ts src/ui/app.ts
          git commit -m "style: format SD-005 presentation sources"
          git push origin HEAD:sd-005-presentation-shell
