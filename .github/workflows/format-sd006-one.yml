name: Format SD-006 registry fixture

on:
  push:
    branches:
      - sd-006-chunk-sleep-wake

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sd-006-chunk-sleep-wake
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/unit/parameter-registry.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/parameter-registry.test.ts
          git commit -m "style: normalize SD-006 registry fixture"
          git push origin HEAD:sd-006-chunk-sleep-wake
