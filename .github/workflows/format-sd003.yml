name: Format SD-003

on:
  push:
    branches:
      - sd-003-parameters-scenarios

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sd-003-parameters-scenarios
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply repository formatting
        run: >-
          npx prettier --write
          src/core/parameters/definitions.ts
          src/core/parameters/registry.ts
          src/core/parameters/store.ts
          src/core/runner/runner.ts
          src/core/scenario/schema.ts
          tests/unit/parameter-registry.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core tests/unit/parameter-registry.test.ts
          git commit -m "style: format SD-003 sources"
          git push origin HEAD:sd-003-parameters-scenarios
