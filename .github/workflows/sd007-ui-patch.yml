name: SD-007 UI patch

on:
  push:
    branches:
      - sd-007-phased-sampling

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sd-007-phased-sampling
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/patch-sd007-ui.py
      - run: npx prettier --write src/ui/app.ts
      - name: Commit UI patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/app.ts
          git commit -m "feat: expose phased sampling counters"
          git push origin HEAD:sd-007-phased-sampling
