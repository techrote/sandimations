name: Format SD-004

on:
  push:
    branches:
      - sd-004-trace-metrics-adapters

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sd-004-trace-metrics-adapters
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply repository formatting
        run: npx prettier --write src/core/model/world.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/model/world.ts
          git commit -m "style: format SD-004 world instrumentation"
          git push origin HEAD:sd-004-trace-metrics-adapters
