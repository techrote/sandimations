name: Format SD-006

on:
  push:
    branches:
      - sd-006-chunk-sleep-wake

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sd-006-chunk-sleep-wake
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply repository formatting
        run: >-
          npx prettier --write
          src/core/runner/state-hash.ts
          src/core/scheduler/chunk-sleep-wake.ts
          tests/e2e/app.spec.ts
          tests/unit/chunk-runner.test.ts
          tests/unit/chunk-scheduler.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/runner/state-hash.ts src/core/scheduler/chunk-sleep-wake.ts tests/e2e/app.spec.ts tests/unit/chunk-runner.test.ts tests/unit/chunk-scheduler.test.ts
          git commit -m "style: format SD-006 sources"
          git push origin HEAD:sd-006-chunk-sleep-wake
