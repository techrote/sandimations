name: SD-008 format repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/core/comparison/comparison.ts src/presentation/comparison-controller.ts src/ui/comparison-app.ts src/main.ts src/comparison.css tests/unit/comparison.test.ts tests/unit/comparison-isolation.test.ts tests/e2e/comparison.spec.ts docs/COMPARISON.md
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs
          git commit -m "chore: format SD-008 files"
          git push
