name: SD-008 format repair

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reconcile final SD-008 source, tests, and RAG
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old in text:
                  return text.replace(old, new, 1)
              if new in text:
                  return text
              raise SystemExit(f"missing expected {label} text")

          app_path = Path('src/ui/comparison-app.ts')
          app = app_path.read_text()
          app = replace_once(
              app,
              "provenance.dataset.testid = `${testId}-provenance`;",
              "provenance.dataset.testid = `${testId.replace(/-canvas$/, '')}-provenance`;",
              'comparison provenance test id',
          )
          app_path.write_text(app)

          e2e_path = Path('tests/e2e/comparison.spec.ts')
          e2e = e2e_path.read_text()
          old = """  await expect(page.getByTestId('comparison-optimized-provenance')).toContainText(\n    'phased-sampling-v1',\n  );\n  await expect(page.getByTestId('comparison-caveat')).toContainText(\n"""
          new = """  await expect(page.getByTestId('comparison-optimized-provenance')).toContainText(\n    'phased-sampling-v1',\n  );\n  await expect(page.getByTestId('comparison-metrics-provenance')).toContainText('phase-clock-v1');\n  await expect(page.getByTestId('comparison-metrics-provenance')).toContainText(\n    'phased-sampling-v1',\n  );\n  await expect(page.getByTestId('comparison-caveat')).toContainText(\n"""
          e2e = replace_once(e2e, old, new, 'phased metrics provenance assertion')
          old = """  await expect(page.getByTestId('compare-baseline-phases')).toHaveText('4');\n  await expect(page.getByTestId('compare-optimized-phases')).toHaveText('4');\n"""
          new = """  await expect(page.getByTestId('compare-baseline-phase-count')).toHaveText('1');\n  await expect(page.getByTestId('compare-optimized-phase-count')).toHaveText('4');\n  await expect(page.getByTestId('compare-baseline-native-frames')).toHaveText('4');\n  await expect(page.getByTestId('compare-optimized-native-frames')).toHaveText('1');\n  await expect(page.getByTestId('compare-baseline-phases')).toHaveText('4');\n  await expect(page.getByTestId('compare-optimized-phases')).toHaveText('4');\n"""
          e2e = replace_once(e2e, old, new, 'native phase/frame assertions')
          old = """  await expect(page.getByTestId('comparison-optimized-provenance')).toContainText(\n    'chunk-sleep-wake-v1',\n  );\n\n  await page.getByTestId('comparison-step-count').fill('8');\n"""
          new = """  await expect(page.getByTestId('comparison-optimized-provenance')).toContainText(\n    'chunk-sleep-wake-v1',\n  );\n  await expect(page.getByTestId('comparison-metrics-provenance')).toContainText('phase-clock-v1');\n  await expect(page.getByTestId('comparison-metrics-provenance')).toContainText(\n    'chunk-sleep-wake-v1',\n  );\n\n  await page.getByTestId('comparison-step-count').fill('8');\n"""
          e2e = replace_once(e2e, old, new, 'chunk metrics provenance assertion')
          e2e_path.write_text(e2e)

          rag_path = Path('docs/RAG.md')
          rag = rag_path.read_text()
          rag = replace_once(
              rag,
              """### M2 — First explanatory app — in progress\n\nSD-005 completed the generic evidence-driven application shell. SD-006 adds the first real optimization demo: deterministic chunk sleep/wake state, actual avoided cell evaluation while regions sleep, local/cross-chunk wake causes, registered scheduler parameters, chunk metrics, and trace-backed visualization. SD-007 is now the next primary target: the signature phased-sampling scheduler and phase-by-phase visual explanation.""",
              """### M2 — First explanatory app — complete\n\nSD-005 completed the generic evidence-driven application shell. SD-006 added the first real optimization demo: deterministic chunk sleep/wake state, actual avoided cell evaluation while regions sleep, local/cross-chunk wake causes, registered scheduler parameters, chunk metrics, and trace-backed visualization. SD-007 completed the signature phased-sampling scheduler with real sparse per-phase evaluation, trace-backed selection/coverage evidence, registered phase controls, and phase-by-phase visual explanation.""",
              'M2 status',
          )
          rag = replace_once(
              rag,
              """### M3 — Comparative and presentation tooling\n\nBaseline-vs-optimized mode, divergence/work metrics, timeline/phase inspector, shareable scenario state, presentation mode, accessibility hardening, and deployable static build.""",
              """### M3 — Comparative and presentation tooling — in progress\n\nSD-008 establishes deterministic baseline-vs-optimized orchestration, provenance-bound work/divergence metrics, and split/overlay comparison views. SD-009 follows with timeline, shareable state, and presentation tooling; SD-010 then hardens accessibility, browser behavior, performance, and deployment.""",
              'M3 status',
          )
          rag = replace_once(
              rag,
              "| SD-007 | [#7](https://github.com/techrote/sandimations/issues/7) | Phased-sampling teaching model + **primary visual/phase-step explanation** | SD-002, SD-004; integrates with SD-003/005 | next |",
              "| SD-007 | [#7](https://github.com/techrote/sandimations/issues/7) | Phased-sampling teaching model + **primary visual/phase-step explanation** | SD-002, SD-004; integrates with SD-003/005 | complete |",
              'SD-007 work graph status',
          )
          rag = replace_once(
              rag,
              "| SD-008 | [#8](https://github.com/techrote/sandimations/issues/8) | Baseline-vs-optimized comparison and divergence/work instrumentation | SD-006, SD-007 | after both demos expose stable metrics |",
              "| SD-008 | [#8](https://github.com/techrote/sandimations/issues/8) | Baseline-vs-optimized comparison and divergence/work instrumentation | SD-006, SD-007 | complete |",
              'SD-008 work graph status',
          )
          rag = replace_once(
              rag,
              "- SD-007 is the next primary issue and should extend the common evidence/overlay vocabulary instead of introducing a competing state or stepping path.",
              "- SD-007 is complete; phased sampling uses the common evidence/overlay and stepping contracts rather than a competing state or stepping path.",
              'SD-007 concurrency status',
          )
          rag = replace_once(
              rag,
              "- SD-007 must make the existing phase/tick control visually meaningful by exposing real per-phase scheduler selections through the SD-004 evidence path; it must not create a competing stepping path or visual-only fake sampling mask.",
              "- SD-007 exposes real per-phase scheduler selections through the SD-004 evidence path; comparison and presentation work must consume those facts rather than synthesize sampling masks.",
              'SD-007 evidence rule',
          )
          rag = replace_once(
              rag,
              "- SD-008 requires both scheduler stories to expose stable metrics/provenance through the common evidence contract.",
              "- SD-008 compares independent full-scan-reference and optimized runners through the stable SD-004/006/007 evidence contracts. It synchronizes deterministic comparison ticks without sharing mutable simulation state and keeps deterministic work counters distinct from wall-clock timing.",
              'SD-008 concurrency rule',
          )
          rag = replace_once(
              rag,
              "SD-008 will measure divergence explicitly. See `docs/CHUNK_SLEEP_WAKE.md` for the full teaching-model contract and fidelity caveat.",
              "SD-008 measures that divergence explicitly rather than asserting physical identity. See `docs/CHUNK_SLEEP_WAKE.md` for the full teaching-model contract and fidelity caveat.",
              'SD-006 divergence handoff',
          )
          rag = replace_once(
              rag,
              "Mitigation: define each divergence/work metric, preserve provenance, and avoid asserting identical physical output unless guaranteed. SD-004 metrics explicitly distinguish deterministic work evidence from wall-clock speed.",
              "Mitigation: SD-008 defines cell-material Hamming divergence and deterministic work ratios in code and documentation, preserves both sides' provenance, and avoids asserting physical identity. SD-004 metrics explicitly distinguish deterministic work evidence from wall-clock speed.",
              'R6 mitigation',
          )
          rag = replace_once(
              rag,
              "| SD-007 | [#7](https://github.com/techrote/sandimations/issues/7) | ready / next | Phased sampling scheduler/demo; primary visual explanation over landed SD-004/005/006 contracts |",
              "| SD-007 | [#7](https://github.com/techrote/sandimations/issues/7) | completed | PR #18 plus #19 visual-truthfulness repair; real phased selection/evaluation and phase explanation |",
              'SD-007 ledger',
          )
          rag = replace_once(
              rag,
              "| SD-008 | [#8](https://github.com/techrote/sandimations/issues/8) | planned | Comparison mode |",
              "| SD-008 | [#8](https://github.com/techrote/sandimations/issues/8) | completed | PR #20; independent full-scan-reference comparisons, provenance-bound work/divergence metrics, split/overlay UI |",
              'SD-008 ledger',
          )
          comparison_section = """## SD-007 phased sampling scheduler\n\nSD-007 introduces strategy `phased-sampling-v1` as a real sparse-evaluation teaching scheduler. Cells are assigned deterministically to phases, only the current phase is evaluated on each scheduler tick, and selection/coverage evidence is emitted through the SD-004 trace path. The presentation therefore shows real scheduler decisions rather than a visual-only sampling mask. The final SD-007 repair also made `evaluated-now` overlays exclusively trace-backed when material evaluation is disabled.\n\n## SD-008 deterministic comparison\n\nSD-008 runs independent baseline and optimized `SimulationRunner` instances from equivalent canonical non-scheduler scenario data. One `phase-clock-v1` full scan is executed for every optimized comparison tick, preserving ordered tick-based inputs/events while providing an auditable work reference for chunk sleep/wake and phased sampling. No model, PRNG, parameter-store, scheduler, trace, or metrics state is shared between sides.\n\nComparison metrics retain backend/strategy/scenario provenance. Deterministic work ratios use the existing SD-004 work-unit definition and are explicitly not wall-clock speed measurements. Physical difference is measured by the defined `cell-material-hamming-v1` metric rather than inferred from rendered pixels. Split and overlay views reuse SD-005 presentation/view-model and Canvas contracts. See `docs/COMPARISON.md` for clock semantics, formulas, limitations, scenarios, and verification requirements.\n\n"""
          marker = "## Initial UX target\n"
          if "## SD-008 deterministic comparison\n" not in rag:
              if marker not in rag:
                  raise SystemExit('missing Initial UX target insertion point')
              rag = rag.replace(marker, comparison_section + marker, 1)
          rag_path.write_text(rag)
          PY
      - name: Format SD-008 files
        run: npx prettier --write src/core/comparison/comparison.ts src/presentation/comparison-controller.ts src/ui/comparison-app.ts src/main.ts src/comparison.css tests/unit/comparison.test.ts tests/unit/comparison-isolation.test.ts tests/unit/comparison-canonical.test.ts tests/e2e/comparison.spec.ts docs/COMPARISON.md docs/RAG.md
      - name: Commit reconciliation if needed
        run: |
          if git diff --quiet -- src tests docs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs
          git commit -m "chore: reconcile SD-008 implementation"
          git push
