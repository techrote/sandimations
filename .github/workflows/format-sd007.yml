name: Format SD-007

on:
  push:
    branches:
      - sd-007-phased-sampling

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sd-007-phased-sampling
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/ui/world-canvas.ts tests/e2e/app.spec.ts tests/unit/phased-runner.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/world-canvas.ts tests/e2e/app.spec.ts tests/unit/phased-runner.test.ts
          git commit -m "style: format SD-007 sources"
          git push origin HEAD:sd-007-phased-sampling
