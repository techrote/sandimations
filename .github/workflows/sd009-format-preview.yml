name: SD-009 format preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format changed SD-009 files
        run: |
          npx prettier --write \
            src/presentation/share-state.ts \
            src/presentation/timeline.ts \
            src/scenarios/library.ts \
            src/ui/scenario-experience.ts \
            tests/e2e/scenario-experience.spec.ts \
            tests/unit/scenario-library.test.ts
      - name: Print formatted files
        run: |
          for file in \
            src/presentation/share-state.ts \
            src/presentation/timeline.ts \
            src/scenarios/library.ts \
            src/ui/scenario-experience.ts \
            tests/e2e/scenario-experience.spec.ts \
            tests/unit/scenario-library.test.ts; do
            echo "===== $file ====="
            cat "$file"
          done
