name: SD-009 format preview

on:
  pull_request:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format changed SD-009 files
        run: |
          npx prettier --write \
            src/presentation/share-state.ts \
            src/presentation/timeline.ts \
            src/scenarios/library.ts \
            src/ui/scenario-experience.ts \
            tests/e2e/scenario-experience.spec.ts \
            tests/unit/scenario-library.test.ts
      - name: Commit formatter output
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add \
              src/presentation/share-state.ts \
              src/presentation/timeline.ts \
              src/scenarios/library.ts \
              src/ui/scenario-experience.ts \
              tests/e2e/scenario-experience.spec.ts \
              tests/unit/scenario-library.test.ts
            git commit -m "chore: format SD-009 files"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
