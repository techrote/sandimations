name: SD-009 format final coverage

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/e2e/scenario-experience.spec.ts tests/unit/scenario-library.test.ts
      - name: Commit formatter output
        run: |
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add tests/e2e/scenario-experience.spec.ts tests/unit/scenario-library.test.ts
            git commit -m "chore: format final SD-009 coverage"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
