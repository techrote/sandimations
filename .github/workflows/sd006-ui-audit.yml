name: SD-006 UI audit patch

on:
  push:
    branches:
      - sd-006-chunk-sleep-wake

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sd-006-chunk-sleep-wake
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/sd006-ui-audit.py
      - run: npx prettier --write src/ui/app.ts tests/e2e/app.spec.ts
      - name: Commit audit patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/app.ts tests/e2e/app.spec.ts
          git commit -m "feat: expose chunk activity metrics in UI"
          git push origin HEAD:sd-006-chunk-sleep-wake
