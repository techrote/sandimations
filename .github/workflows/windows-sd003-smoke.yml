name: Windows SD-003 Smoke

on:
  push:
    branches:
      - sd-003-parameters-scenarios

permissions:
  contents: read

jobs:
  shortcuts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: sd-003-parameters-scenarios
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Exercise Setup.cmd
        shell: cmd
        run: call Setup.cmd --no-pause
      - name: Exercise Verify.cmd
        shell: cmd
        run: call Verify.cmd --no-pause
      - name: Validate Run.cmd launch path
        shell: powershell
        run: |
          $content = Get-Content -Raw Run.cmd
          if (-not $content.Contains('call npm run dev -- --open')) { throw 'Run.cmd does not invoke the canonical dev command.' }
          if (-not $content.Contains('call "%~dp0Setup.cmd" --no-pause')) { throw 'Run.cmd does not bootstrap missing dependencies.' }
