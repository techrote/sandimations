name: SD-007 truthfulness repair

on:
  push:
    branches: [sd-007-truthfulness-fix]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sd-007-truthfulness-fix
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node .github/sd007-repair.mjs
      - run: npx prettier --write src/presentation/app-view-model.ts tests/unit/app-view-model.test.ts tests/e2e/app.spec.ts docs/PHASED_SAMPLING.md
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: rm .github/sd007-repair.mjs .github/workflows/sd007-truthfulness-repair.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep phased evaluation overlays trace-backed"
          git push origin HEAD:sd-007-truthfulness-fix
